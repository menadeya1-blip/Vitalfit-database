<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalFit - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="./favicon_32X32/V.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/index.css">
  <!--
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">-->
  <script src="./gimnasio_js/main.js" defer></script>
  <script src="./gimnasio_js/app.js" defer></script>
<!--
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>-->

</head>
<body class="netflix-bg">

  <!-- Navbar sencilla tipo Netflix -->
  <header class="navbar-netflix">
    <div class="logo">⚡ VITAL<span>FIT</span></div>
  </header>

  <main class="auth-container">

    <!-- TARJETA UNIFICADA (Estilo Netflix) -->
    <div class="netflix-card">
      
      <!-- CONTENEDOR 1: INICIO DE SESIÓN -->
      <div id="login-container" class="auth-box">
        <h2>Inicia Sesión</h2>
        
        <form id="loginForm" action="/vitalfit/login" method="POST" class="form-vertical">
          <div class="form-group">
            <input type="email" name="email" id="login_email" placeholder="Correo electrónico" autocomplete="username" required>
          </div>

          <div class="form-group">
            <input type="password" name="password" id="login_password" placeholder="Contraseña" autocomplete="current-password" required>
          </div>

          <button type="submit" id= "btnlogin" class="btn btn-primary btn-full">

            <span id="spinnerTextlogin">Iniciar sesión</Span>

            <span id="spinnerLoadingLogin" class="spinner" style="display: none;"></span>
          </button>

          <div class="form-actions-netflix">
            <label class="switch-label">
              <input type="checkbox" id="remember_me">
              <span>Recuérdame</span>
            </label>
            <a href="#" class="help-link">¿Necesitas ayuda?</a>
          </div>
        </form>

        <!-- Botón/Enlace alternador hacia Registro -->
        <div class="switch-auth-mode">
          <p>¿Primera vez en VitalFit? <button type="button" id="btn-show-register" class="btn-text-action">Registrarse.</button></p>
        </div>
      </div>

      <!-- CONTENEDOR 2: REGISTRO (Oculto inicialmente, activo con la clase 'active') -->
      <div id="register-container" class="auth-box hidden">
        <h2>Únete a VitalFit</h2>
        <p class="subtitle">Paso 1: Crea tu perfil biométrico (Sprint 1)</p>
        
        <form id="registerForm" action="/vitalfit/register" method="POST" class="form-grid">
          <!-- nombre -->
          <div class="form-group full-width">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="firstName" placeholder="Nombre" required>
          </div>
          <!-- apellido -->
          <div class="form-group full-width">
            <label for="nombre">Apellido *</label>
            <input type="text" id="apellido" name="lastName" placeholder="Apellido" required>
          </div>
          <!-- email -->
          <div class="form-group full-width">
            <label for="email">Correo Electrónico *</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="username" required>
          </div>

          <!-- password -->
          <div class="form-group full-width">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
          </div>

          <!-- age -->
          <div class="form-group">
            <label for="age">Edad *</label>
            <input type="number" id="age" name="age" placeholder="25" min="14" max="100" required>
          </div>

          <!-- weight -->
          <div class="form-group">
            <label for="weight">Peso (kg) *</label>
            <input type="number" step="0.1" id="weight" name="weight" placeholder="Peso" min="20" max="300" required>
          </div>

          <!-- height -->
          <div class="form-group">
            <label for="height">Estatura (cm) *</label>
            <input type="number" id="height" name="height" placeholder="Estatura" min="100" max="250" required>
          </div>

          <!-- goal -->
          <div class="form-group">
            <label for="goal">Objetivo *</label>
            <select id="goal" name="goal" required>
              <option value="" disabled selected>Selecciona...</option>
              <option value="MUSCLE_GAIN">Ganancia Muscular</option>
              <option value="FAT_LOSS">Pérdida de Grasa</option>
              <option value="MAINTENANCE">Mantenimiento</option>
            </select>
          </div>

          <!-- Mensaje de exito que se mostrara al completar registro-->     

          <div class="form-group full-width">
            <div id="mensajeExito" class="mensaje-exito" style="display: none;" >
            ¡Registro exitoso!
            Redirigiendo a tu Onboarding...
            </div>

            <button type="submit" id="btnRegistro" class="btn btn-primary btn-full">
              <span id="spinnerText">Registrarme e Iniciar Onboarding</span>
              <span id="spinnerLoading" class="spinner" style="display: none;"></span>
            </button>            
          </div>
        </form>

        <!-- Botón/Enlace alternador hacia Login -->
        <div class="switch-auth-mode">
          <p>¿Ya tienes cuenta? <button type="button" id="btn-show-login" class="btn-text-action">Inicia sesión aquí.</button></p>
        </div>
      </div>

    </div>

  </main>
</body>
</html>
